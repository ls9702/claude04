# XcodeGen 프로젝트 정의. Mac에서 `xcodegen generate` 실행 → TripShot.xcodeproj 생성.
# (Xcode에서 직접 만들고 싶으면 docs/MAC_SETUP.md의 "수동 생성" 절 참고)
name: TripShot
options:
  bundleIdPrefix: com.ls9702
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.2.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # Xcode > Signing에서 개인 Apple ID 팀 선택 (무료 계정)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  TripShot:
    type: application
    platform: iOS
    sources:
      - path: TripShot
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: YouTubeKit
    info:
      path: TripShot/Info.plist
      properties:
        CFBundleDisplayName: TripShot
        CFBundleName: TripShot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "사진과 쇼츠 클립을 촬영하기 위해 카메라를 사용합니다."
        NSMicrophoneUsageDescription: "쇼츠 클립의 소리를 녹음하기 위해 마이크를 사용합니다."
        NSPhotoLibraryUsageDescription: "보정할 사진과 클립을 불러오기 위해 사진 보관함에 접근합니다."
        NSPhotoLibraryAddUsageDescription: "보정한 사진과 완성한 쇼츠를 사진 보관함에 저장합니다."
        NSLocationWhenInUseUsageDescription: "촬영 위치를 사진에 기록하기 위해 사용합니다. (선택)"
        UIBackgroundModes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ls9702.tripshot
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # R1-S5: Core Image Metal 커널(TripShot/Portrait/PortraitKernels.metal)을 default.metallib로 빌드하려면 필요.
        MTL_COMPILER_FLAGS: "-fcikernel"
        MTLLINKER_FLAGS: "-cikernel"
  TripShotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TripShotTests]
    dependencies:
      - target: TripShot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true   # 테스트 번들 Info.plist 자동 생성 (없으면 코드 서명 실패)
        PRODUCT_BUNDLE_IDENTIFIER: com.ls9702.tripshotTests
schemes:
  TripShot:
    build:
      targets: { TripShot: all, TripShotTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [TripShotTests]
